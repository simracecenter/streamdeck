<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Director Connection</title>
    <style>
      body { margin: 12px; background: #202225; color: #f5f5f5; font: 13px sans-serif; }
      label { display: block; margin: 10px 0 4px; }
      input, button { box-sizing: border-box; width: 100%; padding: 7px; }
      button { margin-top: 12px; }
      #result { min-height: 18px; margin-top: 8px; }
    </style>
  </head>
  <body>
    <label for="directorUrl">Director URL</label>
    <input id="directorUrl" type="url" value="http://127.0.0.1:8782">
    <label for="code">Pairing code</label>
    <input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
    <label for="name">Surface name</label>
    <input id="name" maxlength="64" value="Stream Deck">
    <button id="pair" type="button">Pair</button>
    <div id="result" role="status"></div>
    <script>
      let socket;
      let actionInfo;
      let inspectorUUID;
      function connectElgatoStreamDeckSocket(port, pluginUUID, registerEvent, _info, rawActionInfo) {
        actionInfo = JSON.parse(rawActionInfo);
        inspectorUUID = pluginUUID;
        socket = new WebSocket(`ws://127.0.0.1:${port}`);
        socket.onopen = () => socket.send(JSON.stringify({ event: registerEvent, uuid: pluginUUID }));
        socket.onmessage = event => {
          const message = JSON.parse(event.data);
          if (message.event === "sendToPropertyInspector" && message.payload?.type === "connection") {
            if (message.payload.directorUrl) document.querySelector("#directorUrl").value = message.payload.directorUrl;
          }
          if (message.event === "sendToPropertyInspector" && message.payload?.type === "pair-result") {
            document.querySelector("#result").textContent = message.payload.ok ? "Paired successfully." : message.payload.error || "Pairing failed.";
          }
        };
      }
      function sendToPlugin(payload) {
        socket?.send(JSON.stringify({ action: actionInfo.action, event: "sendToPlugin", context: inspectorUUID, payload }));
      }
      document.querySelector("#pair").addEventListener("click", () => {
        document.querySelector("#result").textContent = "Pairing…";
        sendToPlugin({
          type: "pair",
          directorUrl: document.querySelector("#directorUrl").value,
          code: document.querySelector("#code").value,
          name: document.querySelector("#name").value,
        });
      });
    </script>
  </body>
</html>
