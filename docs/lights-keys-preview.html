<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Stream Deck lighting assets</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 24px; background: #14171b; color: #f2f4f7; font: 15px "Segoe UI", sans-serif; }
      h1 { margin: 0 0 20px; font-size: 22px; }
      .asset-grid { display: grid; grid-template-columns: repeat(9, 112px); gap: 10px; width: max-content; }
      figure { margin: 0; width: 112px; text-align: center; }
      figure img { display: block; width: 88px; height: 88px; margin: 0 auto 5px; }
      figcaption { height: 32px; color: #d6dbe2; font-size: 12px; line-height: 15px; }
    </style>
  </head>
