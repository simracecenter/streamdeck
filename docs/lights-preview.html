<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Stream Deck LIGHTS preview</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 24px; background: #14171b; color: #f2f4f7; font: 15px "Segoe UI", sans-serif; }
      h1 { margin: 0 0 20px; font-size: 22px; }
      h2 { margin: 28px 0 14px; font-size: 17px; }
      .page { display: grid; grid-template-columns: repeat(5, 144px); gap: 10px; width: max-content; padding: 16px; background: #20252b; border: 1px solid #38414b; border-radius: 12px; }
      figure { margin: 0; width: 144px; text-align: center; }
      figure img { display: block; width: 120px; height: 120px; margin: 0 auto 5px; }
      figcaption { height: 32px; color: #d6dbe2; font-size: 12px; line-height: 15px; }
    </style>
  </head>
  <body>
    <h1>Sim RaceCenter — LIGHTS page</h1>
    <section class="page" aria-label="LIGHTS Stream Deck page">
      <figure><img src="../com.simracecenter.director.sdPlugin/imgs/keys/green.svg" alt=""><figcaption>AUTO</figcaption></figure>
      <figure><img src="../com.simracecenter.director.sdPlugin/imgs/keys/green.svg" alt=""><figcaption>LIGHTS ON</figcaption></figure>
      <figure><img src="../com.simracecenter.director.sdPlugin/imgs/keys/grey.svg" alt=""><figcaption>BRIGHT −10</figcaption></figure>
      <figure><img src="../com.simracecenter.director.sdPlugin/imgs/keys/grey.svg" alt=""><figcaption>BRIGHT +10</figcaption></figure>
      <figure><img src="../com.simracecenter.director.sdPlugin/imgs/keys/flag-clear-dim.svg" alt=""><figcaption>CLEAR</figcaption></figure>
      <figure><img src="../com.simracecenter.director.sdPlugin/imgs/keys/flag-green-dim.svg" alt=""><figcaption>GREEN</figcaption></figure>
      <figure><img src="../com.simracecenter.director.sdPlugin/imgs/keys/flag-yellow-dim.svg" alt=""><figcaption>YELLOW</figcaption></figure>
      <figure><img src="../com.simracecenter.director.sdPlugin/imgs/keys/flag-blue-dim.svg" alt=""><figcaption>BLUE</figcaption></figure>
      <figure><img src="../com.simracecenter.director.sdPlugin/imgs/keys/flag-white-dim.svg" alt=""><figcaption>WHITE</figcaption></figure>
      <figure><img src="../com.simracecenter.director.sdPlugin/imgs/keys/flag-red-dim.svg" alt=""><figcaption>RED</figcaption></figure>
      <figure><img src="../com.simracecenter.director.sdPlugin/imgs/keys/flag-checkered-dim.svg" alt=""><figcaption>CHECKERED</figcaption></figure>
      <figure><img src="../com.simracecenter.director.sdPlugin/imgs/keys/flag-debris-dim.svg" alt=""><figcaption>DEBRIS</figcaption></figure>
      <figure><img src="../com.simracecenter.director.sdPlugin/imgs/keys/flag-focus-dim.svg" alt=""><figcaption>FOCUS</figcaption></figure>
      <figure><img src="../com.simracecenter.director.sdPlugin/imgs/keys/red.svg" alt=""><figcaption>ALL STOP</figcaption></figure>
      <figure><img src="../com.simracecenter.director.sdPlugin/imgs/keys/grey.svg" alt=""><figcaption>BACK</figcaption></figure>
    </section>
  </body>
</html>
