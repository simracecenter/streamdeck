# SPDX-License-Identifier: GPL-3.0-or-later
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run pack
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/com.simracecenter.director.streamDeckPlugin
